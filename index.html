<!DOCTYPE html>
<html>
<head>
<title>Women Safety Alert System</title>

<style>

body{
    background: linear-gradient(to right,#fff5f5,#ffd6d6);
    margin:0;
    padding:0;
    font-family:Arial;
    text-align:center;

    background:linear-gradient(to right,#ffffff,#ffd6d6);
}

/* Container */

.container{
    margin-top:50px;
}

/* Heading */

h1{
    color:red;
    font-size:55px;
}

/* Paragraph */

p{
    font-size:28px;
}

/* Clock */

#clock{
    color:blue;
    font-size:30px;
}

/* Success Message */

#status{
    color:green;
    font-size:40px;
}

/* SOS Button */

#sos{
    width:220px;
    height:220px;
    border-radius:50%;
    border:none;
    background:red;
    color:white;
    font-size:60px;
    cursor:pointer;

    box-shadow:0px 0px 30px red;

    animation:pulse 1s infinite;
}


/* Button Animation */

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.1);
}

100%{
transform:scale(1);
}

}

#messege{
    margin-top:25px;
    color:green;
    font-size:30px;
}

#helpline{
    margin-top:25px;
    font-size:20px;
}

#location{
    margin-top:40px;
    color:gray;
    font-size:18px;
}

@keyframes emergency{
    0%{
        background:#ffffff;}
        50%{background:#ffb3b3;}
        100%{background:#ffffff;}
}

.alert{
    animation:emergency 0.5s infinite;
}

/* Background Alert Effect */

body.active{
    background-color:#ffcccc;
}

/* Footer */

footer{
    margin-top:50px;
    font-size:22px;
    color:gray;
}

</style>
</head>

<body>

<div class="container">

<h1>Women Safety Alert  Monotoring System</h1>

<h3 id="clock"></h3>
<h3 id="status">🟢 Safety Monitor Active</h3>

<p>
आपातकालीन  परिस्थिति मे नीचे दिये  गए  sos  बटन  को दबाये 
</p>

<button onclick="sendAlert()" id="sos">
SOS
</button>

<h2 id="message"></h2>
<h3>SOS press count :
    <span id="count"
>0</span></h3>

<button onclick="getLocation()">📍Get Location</button>
<p id="location"></p>
<div class="helpline">
    <div>🚓Police :112</div>
     <div>🚑Ambulence :108 </div>
    <div>👩🏻‍🦰Women helpline :1091</div>

<!-- Alarm Sound -->

<audio id="alarm">
<source src="alert sound.mp3" type="audio/mp3">
</audio>

</div>

<footer>
~Developed By Megha/Hema

</footer>

<script>

    let count=0;

/* Live Clock */

setInterval(function(){

document.getElementById("clock").innerHTML=
new Date().toLocaleTimeString();

},1000);


/* SOS Function */

function sendAlert(){
        count++;

document.getElementById("count").innerHTML=count;

document.getElementById("message").innerHTML=
"Emergency Alert Sent Successfully!";

/* Play Alarm */

document.getElementById("alarm").play();

/* Background Change */

document.body.classList.add("alert");
 
let msg = new SpeechSynthesisUtterance(
"Emergency Alert Activated"
);

speechSynthesis.speak(msg);

/* Popup */

alert("Emergency Contacted!");

}
/* Location*/
 
 function getLocation(){
    navigator.geolocation.getCurrentPosition(function(pos){
        document.getElementById("location").innerHTML="Latitude :"+pos.coords.latitude+
        "<br> Longitude :"+
        pos.coords.longitude;
    });
 }

</script>

</body>
</html>
